name: Publish to PyPI

on:
  push:
    tags:
      # The repository is one package, so a bare `v*` says which one is being
      # released; the monorepo's `scjn-v*` scheme is no longer needed.
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install version-check dependencies
        if: github.event_name != 'workflow_dispatch'
        run: pip install packaging

      # Tags are the release trigger, so a stale tag (forgot to bump
      # __version__) must fail loudly instead of re-publishing the
      # previous version under a new tag name. `version` is declared
      # `dynamic` in pyproject.toml, so it has to be read the same way
      # check_package_versions.py reads it, not straight out of `[project]`.
      - name: Verify tag matches pyproject.toml version
        if: github.event_name != 'workflow_dispatch'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(python -c "import sys; sys.path.insert(0, 'scripts'); from check_package_versions import local_version; from pathlib import Path; print(local_version(Path('.')))")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag version $tag_version does not match pyproject.toml version $pkg_version" >&2
            exit 1
          fi

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

      # `TWINE` is an organization secret of legistlan, visible to every
      # repository; PyPI trusted publishing per repository is an open decision
      # of the migration plan and would replace this step.
      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TWINE }}
        run: twine upload dist/*
