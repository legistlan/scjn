[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scjn"
description = "Client for the SCJN's SCOW JSON API and reader for the scjn-leyes release: a Mexican federal law's reform-dated snapshots."
readme = "README.md"
license = { text = "Apache-2.0" }
# 3.10 for the PEP 604 unions (`X | None`) the package evaluates at import:
# they sit in function signatures, so they run when the module is defined.
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
# This package holds SCJN data only: it imports no other package of the
# project, and nothing in the repository (package or scripts) imports the DOF
# libraries (`tests/test_boundary.py`).
dependencies = [
    "requests>=2.31",
    # scjn.cache's own on-disk cache for the scjn-leyes release (issue #209).
    "platformdirs>=4.0",
]
dynamic = ['version']

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/legistlan/scjn"
Documentation = "https://legistlan.github.io/scjn/"
Source = "https://github.com/legistlan/scjn"
Issues = "https://github.com/legistlan/scjn/issues"

[project.scripts]
scjn = "scjn.cli:main"

[tool.setuptools.packages.find]
include = ["scjn", "scjn.*"]

[tool.setuptools.dynamic]
version = {attr = 'scjn.__version__'}

[tool.uv]
# The version is dynamic (read from scjn/__init__.py); without it in the
# cache keys uv would not rebuild the editable install when __version__ bumps.
cache-keys = [{ file = "pyproject.toml" }, { file = "setup.py" }, { file = "scjn/__init__.py" }]
