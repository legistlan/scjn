[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scjn"
description = "Client for the SCJN's SCOW JSON API and reader for the scjn-leyes release: a Mexican federal law's reform-dated snapshots."
readme = "README.md"
license = { text = "Apache-2.0" }
# 3.10 for the PEP 604 unions (`X | None`) the package evaluates at import:
# they sit in function signatures, so they run when the module is defined.
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
# Dependency direction is one way (issue #206/#207): this package imports
# neither nota2md nor dofjson, so it needs nothing from either of them —
# nota2md depends on scjn, never the reverse. The three crawl scripts that
# link laws to the DOF (`scripts/discover_federal_laws.py`,
# `fetch_scjn_legislacion.py`, `recrawl_scjn_outline.py`) do import both,
# from PyPI: the `scripts` dependency group below, never the package.
dependencies = [
    "requests>=2.31",
    # scjn.cache's own on-disk cache for the scjn-leyes release (issue #209).
    "platformdirs>=4.0",
]
dynamic = ['version']

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/legistlan/scjn"

[project.scripts]
scjn = "scjn.cli:main"

[dependency-groups]
# For the three DOF-linking scripts only (see `dependencies` above); not
# published with the package.
scripts = [
    "dofjson>=0.5.0",
    "nota2md>=0.5.0",
]

[tool.setuptools.packages.find]
include = ["scjn", "scjn.*"]

[tool.setuptools.dynamic]
version = {attr = 'scjn.__version__'}
